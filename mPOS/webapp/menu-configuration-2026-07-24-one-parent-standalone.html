:root {
  --fm-primary: #4caf50;
  --fm-primary-hover: #2a8d2e;
  --fm-primary-lightest: #f1f8f2;

  --fg-default: rgba(0, 0, 0, 0.75); /* antd @text-color (fade(#000,75%)) — POS Register body/label text */
  --fg-muted: rgba(0, 0, 0, 0.45); /* antd @text-color-secondary — helper/hint copy */
  --fg-subtle: rgba(0, 0, 0, 0.25); /* antd @disabled-color — disabled text */
  --fg-strong: #000000; /* getContrastColor dark branch / selected-tile border */

  --bg-app: #ffffff;
  --bg-canvas: #f7f8fa; /* right-hand "Add tiles" panel bg (SchematizedContainer.tsx:106) */
  --bg-page: #f0f2f5;
  --bg-row-hover: rgba(0, 0, 0, 0.04);

  --border-default: #e1e6eb;
  --border-strong: #d9d9d9; /* antd @border-color-base — panel/row/tab dividers */
  --border-tile: rgba(28, 29, 31, 0.5);

  --sidebar-bg: #001529;
  --sidebar-fg: rgba(255, 255, 255, 0.65);
  --sidebar-fg-active: #ffffff;
  --sidebar-item-active: #4caf50;

  --tile-red:    rgb(210,4,4);
  --tile-orange:  rgb(198,118,0);
  --tile-gold:    rgb(159,132,37);
  --tile-olive:   rgb(159,132,37); /* alias → gold */
  --tile-grey:    rgb(122,126,135);
  --tile-black:   rgb(0,0,0);
  --tile-green:   rgb(6,132,102);
  --tile-cyan:    rgb(42,149,175);
  --tile-blue:    rgb(4,120,211);
  --tile-purple:  rgb(185,84,208);
  --tile-pink:    rgb(226,65,119);

  --dnd-accent: rgb(111, 189, 111);

  --font-sans: "Lato", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--fg-default);
  background: var(--bg-page);
  -webkit-font-smoothing: antialiased;
}

/* ---------- Shell ---------- */
.app {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: 100vh;
  min-width: 1280px;
}

.sidebar {
  background: var(--sidebar-bg);
  color: var(--sidebar-fg);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar__brand {
  padding: 14px 20px 8px;
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.sidebar__brand-name {
  font-weight: 700;
  font-size: 27px;
  color: var(--fm-primary);
  line-height: 1;
}
.sidebar__brand-sub {
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.6);
  text-transform: uppercase;
  font-weight: 700;
}
.sidebar__nav { padding: 8px 0; flex: 1; overflow-y: auto; }
.nav-section {
  padding: 10px 16px 6px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: rgba(255,255,255,0.85);
  font-weight: 700;
  font-size: 14px;
}
.nav-section .bi { font-size: 16px; }
.nav-section__chev { margin-left: auto; opacity: 0.6; font-size: 12px; }
.nav-item {
  padding: 9px 16px 9px 56px;
  font-size: 14px;
  color: var(--sidebar-fg);
  cursor: pointer;
  position: relative;
}
.nav-item:hover { color: var(--sidebar-fg-active); background: rgba(255,255,255,0.04); }
.nav-item--active {
  background: var(--sidebar-item-active);
  color: #ffffff;
}
.nav-item--active:hover { background: var(--sidebar-item-active); }

.sidebar__support {
  margin: 8px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 4px;
  padding: 8px 0;
}
.sidebar__support-title {
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.55);
  padding: 6px 12px 10px;
  text-align: center;
  font-weight: 700;
}
.support-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  font-size: 13px;
  color: var(--sidebar-fg);
  cursor: pointer;
}
.support-item:hover { color: #fff; background: rgba(255,255,255,0.04); }
.support-item__chev { margin-left: auto; opacity: 0.5; font-size: 11px; }
.support-badge {
  font-size: 9px;
  letter-spacing: 1px;
  background: #2196f3;
  color: #fff;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 700;
}

/* ---------- Top bar ---------- */
.topbar {
  height: 64px;
  background: #fff;
  border-bottom: 1px solid var(--border-default);
  display: grid;
  grid-template-columns: 32px 1fr auto auto;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
}
.iconbtn {
  width: 32px; height: 32px;
  border: none; background: transparent;
  border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg-muted);
  cursor: pointer;
}
.iconbtn:hover { background: var(--bg-row-hover); color: var(--fg-default); }

.search {
  position: relative;
  max-width: 720px;
}
.search input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--border-default);
  border-radius: 4px;
  padding: 0 12px 0 32px;
  font: inherit;
  background: #fff;
  color: var(--fg-default);
}
.search input::placeholder { color: var(--fg-subtle); }
.search input:focus {
  outline: none;
  border-color: var(--fm-primary);
  box-shadow: 0 0 0 2px rgba(76,175,80,0.2);
}
.search__icon {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--fg-subtle);
}

.account {
  text-align: right;
  line-height: 1.2;
}
.account__label { font-size: 11px; color: var(--fg-subtle); }
.account__name { font-weight: 700; font-size: 14px; color: var(--fg-default); }

.userchip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px;
  border: 1px solid var(--border-default);
  border-radius: 4px;
  padding: 0 8px;
  cursor: pointer;
  background: #fff;
}
.userchip__avatar {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #e1e6eb;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg-muted);
  font-size: 12px;
}

/* ---------- Page ---------- */
.page {
  padding: 16px 24px 40px;
}
.card {
  background: #fff;
  border-radius: 6px;
  border: 1px solid var(--border-default);
  box-shadow: 0 0.5px 1px rgba(0,0,0,0.05);
}
.card__body {
  padding: 0 24px 24px;
}

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border-default);
  padding: 0 16px;
}
.tab {
  padding: 14px 24px;
  font-size: 14px;
  color: var(--fg-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-weight: 400;
}
.tab:hover { color: var(--fg-default); }
.tab--active {
  color: var(--fm-primary);
  border-bottom-color: var(--fm-primary);
  font-weight: 700;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 0;
}
.toolbar__right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

.select {
  height: 32px;
  border: 1px solid var(--border-default);
  border-radius: 4px;
  background: #fff;
  padding: 0 28px 0 12px;
  font: inherit;
  color: var(--fg-default);
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-muted) 50%), linear-gradient(135deg, var(--fg-muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) center, calc(100% - 10px) center;
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  min-width: 200px;
}
.select:focus {
  outline: none;
  border-color: var(--fm-primary);
  box-shadow: 0 0 0 2px rgba(76,175,80,0.2);
}

.btn {
  height: 32px;
  padding: 0 16px;
  border-radius: 4px;
  font: inherit;
  font-weight: 400;
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--fg-default);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.btn:hover { color: var(--fm-primary); border-color: var(--fm-primary); }
.btn[disabled] { cursor: not-allowed; opacity: 0.5; color: var(--fg-muted); }
.btn[disabled]:hover { color: var(--fg-muted); border-color: var(--border-strong); }
.btn--primary {
  background: var(--fm-primary);
  border-color: var(--fm-primary);
  color: #fff;
}
.btn--primary:hover { background: var(--fm-primary-hover); border-color: var(--fm-primary-hover); color: #fff; }
.btn--primary[disabled] { background: #f0f2f5; border-color: var(--border-default); color: var(--fg-subtle); }
.btn--primary[disabled]:hover { background: #f0f2f5; border-color: var(--border-default); color: var(--fg-subtle); }

.learn-more {
  color: var(--fg-muted);
  font-size: 14px;
}
.learn-more a { color: var(--fm-primary); text-decoration: none; }
.learn-more a:hover { text-decoration: underline; }

/* ---------- Grid frame ---------- */
.grid-frame {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 24px;
  align-items: stretch;
}
.grid-pane {
  background: #fff;
  border: 1px solid var(--border-default);
  border-radius: 6px;
  padding: 14px 24px 24px;
  min-height: 600px;
  position: relative;
}

/* ---------- Breadcrumb trail (read-only "you are here") ----------
   Width-locked via the `width:0; min-width:100%` trick: the trail reports a
   0px intrinsic width to the max-content-sized grid pane (so it can never
   widen it), then fills 100% of whatever width the tile/carousel rows
   establish. Long labels truncate per-crumb; deep paths collapse the middle
   into a "…" menu — together these keep the collapsed trail comfortably inside
   the pane width so nothing overflows the carousel and the dropdown can show. */
.breadcrumbs {
  width: 0;
  min-width: 100%;
  margin-bottom: 8px;
}
.breadcrumbs__track {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  line-height: 1.3;
  color: var(--fg-subtle);
  user-select: none;
}
.breadcrumbs__crumb {
  white-space: nowrap;
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 0 1 auto;
  min-width: 0;
}
.breadcrumbs__crumb--link {
  appearance: none;
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  border-radius: 3px;
  transition: color 0.12s ease;
}
.breadcrumbs__crumb--link:hover {
  color: var(--fm-primary);
}
.breadcrumbs__crumb--link:focus-visible {
  outline: 2px solid var(--fm-primary);
  outline-offset: 2px;
}
.breadcrumbs__crumb--current {
  color: var(--fg-muted);
  font-weight: 600;
}
.breadcrumbs__sep {
  font-size: 9px;
  color: var(--fg-subtle);
  opacity: 0.65;
  flex: 0 0 auto;
}
/* Collapsed-middle "…" trigger + dropdown */
.breadcrumbs__more {
  position: relative;
  flex: 0 0 auto;
  display: inline-flex;
}
.breadcrumbs__crumb--more {
  appearance: none;
  background: none;
  border: none;
  margin: 0;
  padding: 0 4px;
  min-width: 18px;
  font: inherit;
  line-height: 1;
  letter-spacing: 1px;
  color: var(--fg-subtle);
  cursor: pointer;
  border-radius: 3px;
  max-width: none;
  transition: color 0.12s ease, background 0.12s ease;
}
.breadcrumbs__crumb--more:hover,
.breadcrumbs__crumb--more.is-open {
  color: var(--fm-primary);
  background: var(--bg-row-hover);
}
.breadcrumbs__menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 30;
  min-width: 150px;
  max-width: 240px;
  padding: 4px;
  background: #fff;
  border: 1px solid var(--border-default);
  border-radius: 6px;
  box-shadow: 0 6px 20px rgba(20, 24, 28, 0.14);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.breadcrumbs__menu-item {
  appearance: none;
  background: none;
  border: none;
  text-align: left;
  font: inherit;
  font-size: 13px;
  color: var(--fg-default);
  padding: 7px 12px;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  position: relative;
}
/* Subtle depth guide: a hairline rail before each nested level. */
.breadcrumbs__menu-item::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 7px;
  bottom: 7px;
  width: 1px;
  background: var(--border-default);
  opacity: 0.7;
}
.breadcrumbs__menu-item:first-child::before { display: none; }
.breadcrumbs__menu-item:hover {
  background: var(--bg-row-hover);
  color: var(--fm-primary);
}



/* ---------- Library (right-side palette) ---------- */
.library-pane {
  background: var(--bg-canvas);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  min-height: 600px;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Remove-tile overlay shown when dragging a grid tile.
   Default: semi-transparent black dimmer (white text/icon read cleanly over it
   regardless of the palette content behind).
   Active: fully opaque app Red (#ef5350), text/icon stay white throughout. */
.remove-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 5;
  border-radius: 6px;
  pointer-events: none; /* hit-test is done in JS against the pane bounds */
  animation: remove-overlay-in 0.14s ease-out;
  transition: background 0.15s ease;
}
.remove-overlay__inner {
  /* Stick to the vertical centre of whatever the user can see,
     regardless of how far down the page the overlay extends. */
  position: sticky;
  top: 50vh;
  transform: translateY(-50%);
  text-align: center;
  max-width: 320px;
  color: #ffffff;
  margin: 0 auto;
  padding: 24px;
}
.remove-overlay__icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.12);
  border: 1.5px solid currentColor;
  color: inherit;
  font-size: 24px;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.remove-overlay__title {
  margin: 0 0 6px;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 16px;
  line-height: 24px;
  color: inherit;
}
.remove-overlay__desc {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  color: inherit;
}
.remove-overlay--active {
  background: #ef5350; /* fully opaque solid red — app Red (colors.ts Red / antd @error-color) */
}
/* Text and icon stay white in both states — no overrides needed */
.remove-overlay--active .remove-overlay__icon {
  background: rgba(255, 255, 255, 0.15);
  border-color: #ffffff;
}
@keyframes remove-overlay-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.library-pane__inner {
  display: flex;
  flex-direction: column;
  gap: 24px;
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
}
.library-section { display: flex; flex-direction: column; gap: 12px; }
.library-section__title {
  margin: 0;
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 16px;
  line-height: 1;
  color: rgba(0, 0, 0, 0.85);
}
.library-section__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 104px);
  gap: 8px 6px;
  justify-content: start;
}
/* Library tiles are clickable (click-to-add) AND draggable. Default cursor is
   pointer to communicate clickability; on press it switches to grabbing so
   the user feels they've picked up the tile if they start dragging. */
.library-section__grid .tile { cursor: pointer; transition: transform 0.08s ease, box-shadow 0.12s ease, filter 0.12s ease; }
.library-section__grid .tile:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.library-section__grid .tile:active {
  cursor: grabbing;
  transform: scale(0.94);
  filter: brightness(0.92);
  box-shadow: 0 1px 2px rgba(0,0,0,0.08) inset;
}

/* Brief highlight on the newly added grid tile (click-to-add feedback). */
.tile--flash { animation: tile-flash 0.7s ease-out; }
@keyframes tile-flash {
  0%   { transform: scale(0.86); box-shadow: 0 0 0 0 rgba(19, 86, 177, 0.45); }
  35%  { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(19, 86, 177, 0.22); }
  100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(19, 86, 177, 0); }
}

/* ---------- Tile grid ---------- */
.tile-grid {
  display: grid;
  grid-template-columns: repeat(3, 104px);
  gap: 12px;
  justify-content: start;
  position: relative;
  /* Reserve space for the persistent placeholder even when empty */
  min-height: 42px;
}
/* Drop-zone boundary. Drawn on a pseudo-element expanded ~12px beyond the tile
   block so there's an edge gutter for the first/last insertion lines to live in
   (see EDGE_GUTTER in app.jsx). The box-shadow is inset so only the border
   paints — the interior shows tiles through.

   Hidden by default; appears (grey) the moment any drag starts (.tile-grid--dragging),
   and turns green via the active fill layer (.tile-grid__fill) when the grid is a
   valid drop target. The active treatment lives on a separate layer so it can
   fade in/out — pseudo-element transitions are unreliable here. */
.tile-grid::before {
  content: "";
  position: absolute;
  left: -12px;
  right: -12px;
  top: -12px;
  bottom: -12px;
  border-radius: 10px;
  box-shadow: inset 0 0 0 1px transparent;
  pointer-events: none;
  transition: box-shadow 0.12s ease;
}
.tile-grid--dragging::before {
  box-shadow: inset 0 0 0 1px var(--border-default);
}
/* Active fill layer — accent border + faint accent tint. Turned on (faded in via
   opacity) ONLY while a palette tile is dragged over the grid (add / replace), to
   confirm this is the valid drop area. Sits behind the tiles; clears on release /
   cross-out. Reorder and remove never activate it. */
.tile-grid__fill {
  position: absolute;
  left: -12px;
  right: -12px;
  top: -12px;
  bottom: -12px;
  border-radius: 10px;
  box-shadow: inset 0 0 0 2px var(--dnd-accent);
  background: color-mix(in srgb, var(--dnd-accent) 8%, transparent);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}
.tile-grid--active .tile-grid__fill { opacity: 1; }

.tile {
  width: 104px;
  height: 42px;
  border-radius: 4px;
  border: 0.5px solid var(--border-tile);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 14px;
  line-height: 1.2;
  text-align: center;
  padding: 4px 8px;
  user-select: none;
  cursor: grab;
  position: relative;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.tile:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.tile:active { cursor: grabbing; }
.tile__label {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  hyphens: auto;
}

/* Replace state — applied to an existing grid tile while a library tile is
   being dragged over it. Translucent blue veil + 1px blue border + small
   "Replace" callout floating above the tile. (Per Figma /Replace-tile.) */
.tile--replace { border-color: var(--dnd-accent) !important; border-width: 1px !important; }
.tile__replace-veil {
  position: absolute;
  inset: 0;
  border-radius: 4px;
  background: var(--dnd-accent);
  opacity: 0.20;
  pointer-events: none;
}
.tile__replace-callout {
  position: absolute;
  left: 50%;
  top: -22px;
  transform: translateX(-50%);
  width: 46px;
  height: 14px;
  background: #797979;
  border-radius: 2px;
  opacity: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 2px;
  font-family: var(--font-sans);
  font-weight: 500;
  font-size: 12px;
  line-height: 1;
  color: #ffffff;
  pointer-events: none;
  white-space: nowrap;
}

/* ---------- Tile hover state: remove (×) button ---------- */
.tile-remove-btn {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.3);
  border: none;
  padding: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  transition: background 0.12s ease;
  z-index: 2;
}
.tile-remove-btn:hover {
  background: #ef5350;
}
.tile-remove-btn:focus { outline: none; }
.tile-remove-btn:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.7);
  outline-offset: 1px;
}
/* Variant X — button sits at the tile corner, 2 px beyond each surface edge */
.tile-remove-btn--corner {
  top: -4px;
  right: -4px;
}
/* Variant X — both buttons use solid #797979 (hover states still apply) */
.tile--corner-btns .tile-remove-btn,
.tile--corner-btns .tile-detail-btn {
  background: #797979;
}
.tile--corner-btns .tile-remove-btn:hover { background: #ef5350; }
.tile--corner-btns .tile-detail-btn:hover { background: #4caf50; }

/* ---------- Tile hover state: Detail (i) button (both kinds) ---------- */
/* 20×20 circular pill, bottom-left of the tile. Default black @ 30%; turns
   brand-green when the button itself is hovered. Per Figma
   /Tap-to-Enter-Category-Hover-for-Detail/_Detail Button. */
.tile-detail-btn {
  position: absolute;
  left: 2px;
  bottom: 2px;
  width: 20px;
  height: 20px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.3);
  color: #ffffff;
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: 14px;
  line-height: 17px;
  text-align: center;
  cursor: pointer;
  z-index: 2;
  transition: background-color 0.12s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.tile-detail-btn:hover { background: #4caf50; }
.tile-detail-btn:focus { outline: none; }
.tile-detail-btn:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.85);
  outline-offset: 1px;
}

/* Legacy Enter pill — retained for direct-edit override compatibility but
   no longer rendered. */
.tile-enter-btn { display: none; }

/* ---------- Selected (entered) category tile ---------- */
/* Two variants (controlled via data-selected-style on <body>):
   uniform  — both ancestor and deepest get 2px green border (default)
   bottom   — deepest gets 2px green border; ancestor gets border-bottom
              only (2px), 0 on top / left / right                          */

/* Base (bottom) — brand green border -------------------------------- */
.tile--selected-ancestor {
  border-top: 1px solid var(--border-strong) !important;
  border-left: 1px solid var(--border-strong) !important;
  border-right: 1px solid var(--border-strong) !important;
  border-bottom: 2px solid var(--tile-green) !important;
}
.tile--selected {
  border: 2px solid var(--tile-green) !important;
}

/* Uniform variant ----------------------------------------------- */
[data-selected-style="uniform"] .tile--selected-ancestor,
[data-selected-style="uniform"] .tile--selected {
  border: 2px solid var(--tile-green) !important;
}

/* Bottom variant ------------------------------------------------ */
[data-selected-style="bottom"] .tile--selected-ancestor {
  border-top: 1px solid var(--border-strong) !important;
  border-left: 1px solid var(--border-strong) !important;
  border-right: 1px solid var(--border-strong) !important;
  border-bottom: 2px solid var(--tile-green) !important;
}
[data-selected-style="bottom"] .tile--selected {
  border: 2px solid var(--tile-green) !important;
}

/* Own-color variant — border matches each tile's text color -----
   --tile-color is inherited from .tile--cat-* classes above.      */
[data-selected-border="own-color"] .tile--selected {
  border: 2px solid var(--tile-color) !important;
}
[data-selected-border="own-color"] .tile--selected-ancestor {
  border-top: 1px solid var(--border-strong) !important;
  border-left: 1px solid var(--border-strong) !important;
  border-right: 1px solid var(--border-strong) !important;
  border-bottom: 2px solid var(--tile-color) !important;
}
[data-selected-border="own-color"][data-selected-style="uniform"] .tile--selected-ancestor {
  border: 2px solid var(--tile-color) !important;
}

/* ---------- Entered-view chrome (carousel + divider + back btn) ---------- */
/* Three-column rail centered horizontally in the grid pane: a 46px chevron
   column on each side and the tile area in the middle (3 × 104 + 2 × 12 gap
   = 336px). The rail is used for the carousel row, the back-button row, and
   the tile grid itself — so everything aligns at the same x regardless of
   whether the view is at the top level or inside a category. */
.grid-rail {
  width: 452px; /* 46 + 12 + 336 + 12 + 46 */
  margin: 0 auto;
  display: grid;
  grid-template-columns: 46px 1fr 46px;
  column-gap: 12px;
  align-items: center;
}
/* Tile-grid rail: align children to the TOP so the optional up-back chevron
   sits at the same y as the first row of tiles (not centered against the
   whole grid). */
/* Carousel stack — clipping wrapper + transform-animated inner. The clip's
   height is set inline to (rows*42 + (rows-1)*16). The inner stack contains
   the actual .grid-rail children which rely on the existing
   `.grid-rail + .grid-rail { margin-top: 16px }` rule for spacing. During a
   slide animation an extra .grid-rail is mounted at the top or bottom and
   the inner stack's translateY animates by 58px (= 42 + 16) so it scrolls
   out of the clip. */
.carousel-stack-clip {
  overflow: hidden;
  position: relative;
}
.carousel-stack {
  /* will be transformed by inline style during animation */
  will-change: transform;
}

/* Stacked carousel rows need breathing room between each level. */
.grid-rail + .grid-rail { margin-top: 16px; }
.grid-rail--tiles { align-items: start; }
.grid-rail__left  { grid-column: 1; }
.grid-rail__main  { grid-column: 2; }
.grid-rail__right { grid-column: 3; }

/* Carousel tiles row — 3 tiles in a flex line filling the main rail column. */
.carousel-tiles {
  display: flex;
  gap: 12px;
}
/* Carousel tiles look identical to grid tiles but are click-only (no drag,
   no hover Enter/X, no replace state). */
.tile--nav { cursor: pointer; user-select: none; }
.tile--nav:hover { box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06); }
/* Inert item tiles in the carousel — shown for composition, but not selectable. */
.tile--nav-inert { cursor: default; user-select: none; }
.tile--spacer {
  visibility: hidden;
  pointer-events: none;
}

/* A: While a drag is in flight, carousel tiles dim and become inert */
.carousel-tiles--locked .tile--nav,
.carousel-tiles--locked .tile--nav-inert,
.carousel-tiles--locked .tile--spacer {
  opacity: 0.28;
  filter: grayscale(0.9);
  cursor: not-allowed;
  pointer-events: none;
}
.carousel-tiles--locked .tile--nav:hover,
.carousel-tiles--locked .tile--nav-inert:hover {
  box-shadow: none;
}

/* Full-pane-width divider between carousel row and the back-button + grid. */
.pane-divider {
  height: 1px;
  background: var(--border-default);
  margin: 12px -24px 20px; /* break out of the .grid-pane's 24px padding;
    extra 8px below so the drop-zone ring (which extends 12px above the
    tiles) clears the divider instead of touching it */
}

/* Chevron buttons used by the carousel + back-up. 46×32 white with light
   border + subtle shadow, per Figma /Enter-tile/external/DirectionLeft… */
.chev-btn {
  width: 46px;
  height: 32px;
  flex: 0 0 46px;
  border-radius: 4px;
  border: 1px solid rgb(217, 217, 217);
  background: #ffffff;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.016);
  color: rgba(0, 0, 0, 0.85);
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}
.chev-btn:hover {
  border-color: var(--fm-primary);
  color: var(--fm-primary);
}
.chev-btn--disabled,
.chev-btn[disabled] {
  background: rgb(245, 245, 245);
  color: rgba(0, 0, 0, 0.25);
  cursor: not-allowed;
}
.chev-btn--disabled:hover,
.chev-btn[disabled]:hover {
  border-color: rgb(217, 217, 217);
  color: rgba(0, 0, 0, 0.25);
}
.chev-btn:focus { outline: none; }
.chev-btn:focus-visible {
  outline: 2px solid var(--fm-primary);
  outline-offset: 1px;
}

/* ---------- Delete-confirmation tooltip ---------- */
.delete-tooltip {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translateX(-50%);
  width: max-content;
  padding: 10px;
  background: #ffffff;
  border-radius: 4px;
  box-shadow: 0 2px 7px rgba(0, 35, 11, 0.16);
  font-family: var(--font-sans);
  z-index: 60;
  cursor: default;
  user-select: none;
  animation: delete-tooltip-in 0.12s ease-out;
}
@keyframes delete-tooltip-in {
  from { opacity: 0; transform: translateX(-50%) translateY(2px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.delete-tooltip__content {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 8px;
}
.delete-tooltip__icon {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #ff9800; /* app Orange (colors.ts Orange) */
  color: #ffffff;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 11px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
}
.delete-tooltip__text {
  flex: 1;
  white-space: nowrap;
  font-size: 13px;
  line-height: 16px;
  color: #000000;
}
.delete-tooltip__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.delete-tooltip__btn {
  height: 25px;
  min-width: 31px;
  padding: 3px 8px;
  border-radius: 4px;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 19px;
  cursor: pointer;
  border: 1px solid;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.delete-tooltip__btn--no {
  background: #ffffff;
  border-color: rgb(212, 212, 212);
  color: rgba(0, 0, 0, 0.75);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.043);
}
.delete-tooltip__btn--no:hover { color: var(--fm-primary); border-color: var(--fm-primary); }
.delete-tooltip__btn--yes {
  background: var(--fm-primary);
  border-color: var(--fm-primary);
  color: #ffffff;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.043);
}
.delete-tooltip__btn--yes:hover { background: var(--fm-primary-hover); border-color: var(--fm-primary-hover); }
.delete-tooltip__arrow {
  position: absolute;
  left: 50%;
  bottom: -5px;
  width: 10px;
  height: 10px;
  background: #ffffff;
  transform: translateX(-50%) rotate(45deg);
  box-shadow: 2px 2px 4px rgba(0, 35, 11, 0.10);
  z-index: -1;
}

/* category variants — white bg, colored bold text.
   --tile-color is set here so the selected-border own-color rules
   can inherit it without per-color rule repetition. */
.tile--cat-red    { color: var(--tile-red);    --tile-color: var(--tile-red); }
.tile--cat-orange { color: var(--tile-orange); --tile-color: var(--tile-orange); }
.tile--cat-gold   { color: var(--tile-gold);   --tile-color: var(--tile-gold); }
.tile--cat-olive  { color: var(--tile-olive);  --tile-color: var(--tile-olive); }
.tile--cat-grey   { color: var(--tile-grey);   --tile-color: var(--tile-grey); }
.tile--cat-black  { color: var(--tile-black);  --tile-color: var(--tile-black); }
.tile--cat-green  { color: var(--tile-green);  --tile-color: var(--tile-green); }
.tile--cat-cyan   { color: var(--tile-cyan);   --tile-color: var(--tile-cyan); }
.tile--cat-blue   { color: var(--tile-blue);   --tile-color: var(--tile-blue); }
.tile--cat-purple { color: var(--tile-purple); --tile-color: var(--tile-purple); }
.tile--cat-pink   { color: var(--tile-pink);   --tile-color: var(--tile-pink); }

/* item variants — colored bg, white text */
.tile--item-red    { background: var(--tile-red);    color: #fff; border-color: transparent; }
.tile--item-orange { background: var(--tile-orange); color: #fff; border-color: transparent; }
.tile--item-gold   { background: var(--tile-gold);   color: #fff; border-color: transparent; }
.tile--item-olive  { background: var(--tile-olive);  color: #fff; border-color: transparent; }
.tile--item-grey   { background: var(--tile-grey);   color: #fff; border-color: transparent; }
.tile--item-black  { background: var(--tile-black);  color: #fff; border-color: rgba(0,0,0,0.25); }
.tile--item-green  { background: var(--tile-green);  color: #fff; border-color: transparent; }
.tile--item-cyan   { background: var(--tile-cyan);   color: #fff; border-color: transparent; }
.tile--item-blue   { background: var(--tile-blue);   color: #fff; border-color: transparent; }
.tile--item-purple { background: var(--tile-purple); color: #fff; border-color: transparent; }
.tile--item-pink   { background: var(--tile-pink);   color: #fff; border-color: transparent; }

/* dragging origin slot */
.tile--origin {
  opacity: 0.35;
  filter: grayscale(0.2);
  pointer-events: none;
  box-shadow: inset 0 0 0 1px var(--border-strong);
}
.tile--origin .tile__label { opacity: 0.6; }

/* ghost tile that follows cursor */
.ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  width: 104px;
  height: 42px;
  transform: translate(-50%, -50%) scale(1.04);
  opacity: 0.92;
  box-shadow:
    0 8px 24px rgba(0, 21, 41, 0.25),
    0 2px 6px rgba(0, 21, 41, 0.15);
  border-radius: 4px;
}
.ghost .tile { cursor: grabbing; box-shadow: none; }

/* insertion line */
.insertion-line {
  position: absolute;
  width: 3px;
  height: 42px;
  background: var(--dnd-accent);
  border-radius: 2px;
  pointer-events: none;
  transition: left 0.08s ease, top 0.08s ease;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--dnd-accent) 15%, transparent);
}
.insertion-line::before,
.insertion-line::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--dnd-accent);
  transform: translateX(-50%);
}
.insertion-line::before { top: -5px; }
.insertion-line::after  { bottom: -5px; }

/* hide native drag image — we'll roll our own */
.tile[draggable="true"] { -webkit-user-drag: element; }

/* ---------- Auto-scroll edge affordance ---------- */
/* Fixed strips pinned to the top & bottom of the viewport, only present while
   a drag is in flight. They fade a hint of the insertion color inward from the
   edge so the user learns that lingering near an edge scrolls the long list;
   the active state (currently scrolling that way) is stronger and the chevron
   appears. pointer-events:none keeps them out of the drag hit-testing. */
.autoscroll-edge {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 9990;
  pointer-events: none;
  display: flex;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.16s ease;
}
.autoscroll-edge--top {
  align-items: flex-start;
  padding-top: 10px;
  background: linear-gradient(to bottom,
    color-mix(in srgb, var(--dnd-accent) 26%, transparent),
    transparent);
}
.autoscroll-edge--bottom {
  align-items: flex-end;
  padding-bottom: 10px;
  background: linear-gradient(to top,
    color-mix(in srgb, var(--dnd-accent) 26%, transparent),
    transparent);
}
/* Faintly visible during any drag (parent gates rendering to drag time). */
body.is-dragging .autoscroll-edge { opacity: 0.35; }
body.is-dragging .autoscroll-edge.is-active { opacity: 1; }
.autoscroll-edge__chev {
  color: #fff;
  font-size: 18px;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--dnd-accent);
  box-shadow: 0 2px 8px rgba(0,21,41,0.28);
  opacity: 0;
  transform: scale(0.7);
  transition: opacity 0.14s ease, transform 0.14s ease;
}
.autoscroll-edge.is-active .autoscroll-edge__chev {
  opacity: 1;
  transform: scale(1);
  animation: edge-chev-pulse 0.9s ease-in-out infinite;
}
@keyframes edge-chev-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.12); }
}
@media (prefers-reduced-motion: reduce) {
  .autoscroll-edge.is-active .autoscroll-edge__chev { animation: none; }
}

/* Persistent "next slot" placeholder — always sits at the next insertion point
   (end of last row, or start of a new row when the last row is full, or 0,0
   when the grid is empty). Communicates where the next-added tile will land. */
.tile-placeholder {
  position: absolute;
  width: 104px;
  height: 42px;
  border-radius: 4px;
  border: 1.5px dashed var(--border-strong);
  background: rgba(0, 0, 0, 0.015);
  color: var(--fg-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  pointer-events: none;
}

/* ---------- Sandbox controls (sit above the grid) ---------- */
.sandbox-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 16px;
  flex-wrap: wrap;
}
.sandbox-controls .hint {
  color: var(--fg-subtle);
  font-size: 12px;
  margin-left: auto;
}
.kbd {
  display: inline-block;
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 6px;
  font-family: var(--font-mono, ui-monospace);
  font-size: 11px;
  color: var(--fg-muted);
  background: #fff;
  line-height: 1.4;
}

/* ---------- Detail pane (right side) ---------- */
.detail-pane h3 {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 700;
  color: var(--fg-strong);
}
.detail-pane p {
  margin: 0;
  color: var(--fg-muted);
  font-size: 13px;
  line-height: 1.6;
}
.detail-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  height: 100%;
  color: var(--fg-subtle);
  gap: 8px;
}
.detail-empty .icon {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--bg-canvas);
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-subtle);
  font-size: 22px;
}

/* dragging cursor */
body.is-dragging,
body.is-dragging * { cursor: grabbing !important; }

/* ---------- Detail sidebar (illustrative) ---------- */
/* Right-anchored 670px panel over a 65% black backdrop. Static content;
   exists only to illustrate the interaction. Matches the Figma /Sidebar
   frame. */
.detail-modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  justify-content: flex-end;
  font-family: var(--font-sans);
}
.detail-modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  cursor: pointer;
}
.detail-modal__panel {
  position: relative;
  width: 670px;
  max-width: 100vw;
  height: 100vh;
  background: #ffffff;
  box-shadow: -2px 0 8px rgba(0, 0, 0, 0.15);
  display: flex;
  flex-direction: column;
}
.detail-modal__header {
  position: relative;
  height: 65px;
  border-bottom: 1px solid rgb(232, 232, 232);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 22px;
}
.detail-modal__close {
  width: 16px;
  height: 32px;
  padding: 0;
  border: none;
  background: transparent;
  color: rgb(190, 197, 207);
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.detail-modal__close:hover { color: var(--fg-default); }
.detail-modal__close:focus { outline: none; }
.detail-modal__close:focus-visible {
  outline: 2px solid var(--fm-primary);
  outline-offset: 2px;
  border-radius: 2px;
}
.detail-modal__title {
  margin: 0;
  font-weight: 700;
  font-size: 16px;
  line-height: 32px;
  color: rgb(2, 20, 36);
}
.detail-modal__body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
}
.detail-modal__placeholder {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 16.4px;
  line-height: 1.4;
  color: #000000;
  text-align: center;
}
.detail-modal__footer {
  height: 65px;
  border-top: 1px solid rgb(232, 232, 232);
  padding: 16px 24px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}
/* ---------- Grid empty state ---------- */
.grid-pane--empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
/* Category-level empty state: carousel stays pinned at top, empty state
   fills and centers in the remaining space below the divider. */
.grid-pane--cat-empty {
  display: flex;
  flex-direction: column;
}
.grid-pane--cat-empty .grid-empty-state {
  flex: 1;
  justify-content: center;
  max-width: 300px;
  margin: 0 auto;
}
.grid-empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 14px;
  max-width: 300px;
}
.grid-empty-state__icon {
  font-size: 52px;
  color: var(--fm-primary);
  opacity: 0.6;
  line-height: 1;
}
.grid-empty-state__title {
  margin: 0;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 18px;
  color: var(--fg-strong);
}
.grid-empty-state__desc {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.55;
  color: var(--fg-muted);
}

@keyframes detail-modal-noop { from {} to {} }

/* ---------- Library search ---------- */
.lib-search {
  position: relative;
}
.lib-search__icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--fg-subtle);
  font-size: 14px;
  pointer-events: none;
}
.lib-search__input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--border-default);
  border-radius: 4px;
  padding: 0 12px 0 32px;
  font: inherit;
  font-size: 14px;
  background: #fff;
  color: var(--fg-default);
}
.lib-search__input--has-clear { padding-right: 28px; }
.lib-search__input::placeholder { color: var(--fg-subtle); }
.lib-search__input:focus {
  outline: none;
  border-color: var(--fm-primary);
  box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
}
.lib-search__clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  color: var(--fg-subtle);
  border-radius: 3px;
  font-size: 16px;
  line-height: 1;
}
.lib-search__clear:hover { color: var(--fg-default); background: var(--bg-row-hover); }
.lib-no-results {
  color: var(--fg-subtle);
  font-size: 14px;
  text-align: center;
  padding: 40px 0;
}

/* Matching text in library tiles: white text on black background */
.lib-highlight {
  color: #ffffff;
  background: #000000;
  border-radius: 1px;
}

/* ---------- Top → category "row becomes carousel" enter animation ----------
   A flying overlay carousel is anchored inside the grid-pane padding box. Its
   `top` is the start (clicked row) position; phase B translates it up by
   (endTop - startTop) to the real carousel's landed slot. --anim-dur is set on
   .grid-pane so both the overlay (a descendant) and the fading root grid
   inherit the user's chosen phase duration. */
.fly-carousel-layer {
  position: absolute;
  left: 24px;
  right: 24px;
  z-index: 25;
  pointer-events: none;
  will-change: transform;
}
.fly-carousel {
  position: relative;
}
/* Chevrons fade in over phase A as the row "becomes" a carousel. */
@keyframes flyChevIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.fly-carousel .chev-btn {
  animation: flyChevIn var(--anim-dur, 220ms) ease both;
}
/* Phase A: the root tile grid fades out in place beneath the overlay. */
@keyframes gridEnterFade {
  to { opacity: 0; }
}
.grid-rail--enterfade {
  animation: gridEnterFade var(--anim-dur, 220ms) ease forwards;
  pointer-events: none;
}
/* Phases measure/B: the entered state is committed but held hidden so only the
   flying overlay is visible until it lands, then revealed instantly. */
.grid-pane--entering .carousel-stack-clip,
.grid-pane--entering .grid-rail--tiles,
.grid-pane--entering .grid-empty-state {
  opacity: 0;
  pointer-events: none;
}
