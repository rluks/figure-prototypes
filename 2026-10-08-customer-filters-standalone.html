<!-- ===========================================================================
     Customers agenda: ways to filter the list by tags, predefined filters
     and segments (2026-10-08). One file, a switcher at the bottom:
       A   three dropdowns (Segment, Predefined filter, Tags) + Match all / any
           (2026-10-08: reordered, Match added; the filter field is a
           multi-select like the tags, each filter its own condition; read-only
           once a segment is picked; placeholders "Select segment | predefined filter | tag"; the
           filter list has no headings, its groups split by a line).
           Roman's pick, 2026-10-08. Two tweaks on the switcher replace its
           button: Match hidden / shown (?match=on) and filter names PRD /
           proposed (?names=new). Match is hidden by default: inside a field
           any item matches, across fields all of them, and no join words show.
           Shown: Match All / Any with an ⓘ tooltip, and each filter and each
           tag is its own condition, the and / or between them following Match.
           (The separate Tag and / or switch, ?tj=1, was merged into it.)
           No result counter above the table (Roman, 10-08).
       B   one Filter button, one grouped picker, chips
       C   segment is the view, the tag field and + Filter chips narrow it
           (always AND)
       C+  as C, with Match all / any among the conditions
       D   segment + chips: segment, + Filter chips, the tag field, Match all /
           any (A's order, 2026-10-08). The one-way editable preset was dropped
           2026-10-08: it can't load a segment with two tag conditions (Wine
           Club Regulars).
     A and D: Match is disabled while a segment is picked. What the tag and
     filter fields do then was built three ways (?sm=lock|ro|narrow):
       lock    cleared and disabled; the segment alone filters the list
       ro      the segment's rules shown in them, read-only (disabled)
       narrow  they stay live and narrow the segment, always AND
     Roman kept read-only for both (2026-10-08) and the switcher toggle is
     gone; ?sm=lock and ?sm=narrow still open the other two.
       E   segment is a locked base (2026-10-08, after the segment-in-filter
           research): its conditions are shown read-only, never edited here;
           the tag field and + Filter chips narrow it, always AND. Filters
           that can't change the result are grayed with the reason; a chip
           that can never match the segment turns red, and the empty state
           names it. Two looks: E = a summary line under the row,
           E2 = locked chips boxed with the selector. E and E2 share state.
     A, C and D share one tag field (2026-10-08): figure-manage's
     SelectAutocomplete, antd v3 Select mode="multiple". Type to filter the
     list, picked tags drop out of it, "All items selected" when nothing is
     left, ✕ or Backspace removes a tag. It is one "has any of" condition.
     B and C+ were dropped from the switcher after Roman's first look, C and
     E2 after his review, then E, then D (all 2026-10-08): Roman went with A
     for simplicity. The switcher shows A alone; ?v=B / C / C2 / D / E / E2
     still open the others. Save as segment was removed 2026-10-08
     (outside the PRD); it is in git history (c232d84) if it comes back.

     TRACK A: page body is figure-manage (Lato, antd v3 look, --primary-color
     #4caf50). Shell (sidebar + top header) is
     WebApp 3.0 (Inter, #068466), drawn after the v5 Segments list 9318:1185.
     The :root block is copied from ../tokens.css (Track A rule: inline it).
     Self-contained, opens by double-click. ?v=A|B|C|C2|D|E|E2 &sm=lock|narrow
     &match=on &names=new &phone=1
     =========================================================================== -->

:root {
    /* source: figure-manage/tailwind.config.js (via ../../figure-manage/tokens.css) */
    --primary-color: #4caf50;
    --body-color: #021424;
    --muted: #66717d;
    --error: #ef5350;
    --gray-f5: #f5f5f5;
    --font-sans: "Lato", "Helvetica Neue", Helvetica, Arial, sans-serif;

    /* antd v3 defaults the figure-manage body inherits */
    --ant-border: #d9d9d9;
    --ant-split: #e8e8e8;
    --ant-head-bg: #fafafa;
    --ant-placeholder: #bfbfbf;
    --ant-disabled: rgba(0,0,0,.25);
    --ant-primary-1: #edf7ee;
    --ant-shadow: 0 2px 8px rgba(0,0,0,.15);

    /* WebApp 3.0 shell (Track B values) */
    --v3-primary: #068466;
    --v3-fg: #18181b;
    --v3-muted: #71717a;
    --v3-border: #e4e4e7;
    --v3-shell-bg: #fafafa;
    --v3-accent: #f4f4f5;
    --v3-font: "Inter", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); color: var(--body-color); background: #fff; font-size: 14px; line-height: 1.5715; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
svg { flex-shrink: 0; }

/* ---------------- WebApp 3.0 shell ---------------- */
.app { display: grid; grid-template-columns: 80px 240px 1fr; grid-template-rows: 60px 1fr; height: 100vh; }
.rail { grid-row: 1 / 3; background: var(--v3-shell-bg); border-right: 1px solid var(--v3-border); display: flex; flex-direction: column; align-items: center; font-family: var(--v3-font); }
.rail .logo { margin: 12px 0 20px; width: 34px; height: 34px; border-radius: 8px; background: var(--v3-primary); color: #fff; font-weight: 600; font-size: 14px; display: grid; place-items: center; }
.rail a { width: 56px; padding: 8px 0 6px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--v3-fg); text-decoration: none; margin-bottom: 8px; }
.rail a.on { background: #fff; color: var(--v3-primary); box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.rail .spacer { flex: 1; }
.rail .avatar { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--v3-border); background: #fff; display: grid; place-items: center; font-size: 12px; margin: 8px 0 14px; }
.panel { grid-row: 1 / 3; background: var(--v3-shell-bg); border-right: 1px solid var(--v3-border); padding: 0 16px; font-family: var(--v3-font); font-size: 14px; color: var(--v3-fg); overflow: auto; }
.panel .top { height: 60px; display: flex; align-items: center; justify-content: flex-end; color: var(--v3-muted); }
.panel h6 { margin: 16px 0 12px; font-size: 12px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--v3-muted); }
.panel h6 + .item { margin-top: 0; }
.panel .group + .group { margin-top: 28px; }
.panel .item { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 6px; }
.panel .item.on { background: #fff; color: var(--v3-primary); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.topbar { grid-column: 3; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--v3-border); font-family: var(--v3-font); background: var(--v3-shell-bg); }
.v3btn { height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--v3-border); background: #fff; border-radius: 6px; font-size: 14px; color: var(--v3-fg); cursor: pointer; }
.v3btn.icon { width: 34px; padding: 0; justify-content: center; }
.kbd { font-size: 11px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 4px; background: var(--v3-accent); display: inline-grid; place-items: center; color: var(--v3-muted); }
.topbar .grow { flex: 1; }
.main { grid-column: 3; overflow: auto; background: #fff; }
.mobilebar { display: none; }

/* ---------------- figure-manage page body (antd v3 look) ---------------- */
.page { padding: 20px; }
.card { background: #fff; }
.page h1 { font-size: 24px; line-height: 32px; font-weight: 700; margin: 0 0 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0; border-top: 1px solid var(--ant-split); }
.filters .push { margin-left: auto; }
/* a tag field that wraps onto more lines grows down; the rest of the row stays on its first line */
.filters { align-items: flex-start; }
.filters > .join { line-height: 32px; }
.filters > .matchlbl { height: 32px; }
.filters > .atag { margin-top: 4px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 0 12px; }
.countline { color: var(--muted); font-size: 14px; padding: 4px 0 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.countline b { color: var(--body-color); font-weight: 700; }

.sel { position: relative; height: 32px; min-width: 200px; border: 1px solid var(--ant-border); border-radius: 4px; background: #fff; display: inline-flex; align-items: center; padding: 0 30px 0 11px; cursor: pointer; transition: border-color .2s; text-align: left; }
.sel:hover, .sel.open { border-color: var(--primary-color); }
.sel.open { box-shadow: 0 0 0 2px rgba(76,175,80,.2); }
.sel .ph { color: var(--ant-placeholder); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel .val { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel .arrow { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--ant-disabled); display: flex; }
/* the tag field: antd v3 Select mode="multiple" (figure-manage SelectAutocomplete). No arrow: rc-select hides it in multiple mode */
.sel.multi { height: auto; min-height: 32px; padding: 3px 4px; flex-wrap: wrap; gap: 4px; cursor: text; }
.sel.multi .tin { flex: 1 1 8px; min-width: 8px; height: 24px; border: 0; outline: 0; padding: 0 0 0 2px; background: transparent; font: inherit; color: inherit; }
.sel.multi .tin:only-child { padding-left: 7px; }
.sel.multi .tin::placeholder { color: var(--ant-placeholder); }
.sel .mtag { height: 24px; line-height: 22px; padding: 0 4px 0 10px; background: var(--ant-head-bg); border: 1px solid var(--ant-split); border-radius: 2px; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: rgba(0,0,0,.65); cursor: default; }
.sel .mtag i, .atag i { display: inline-flex; color: rgba(0,0,0,.45); cursor: pointer; font-style: normal; }
.sel .mtag i:hover, .atag i:hover { color: rgba(0,0,0,.85); }

.abtn { height: 32px; padding: 0 15px; border: 1px solid var(--ant-border); border-radius: 4px; background: #fff; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; transition: all .2s; }
.abtn:hover, .abtn.open { color: var(--primary-color); border-color: var(--primary-color); }
.abtn.dashed { border-style: dashed; }
.abtn.on { color: var(--primary-color); border-color: var(--primary-color); }
.abtn .badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--primary-color); color: #fff; font-size: 12px; line-height: 20px; padding: 0 6px; }
.alink { background: none; border: 0; padding: 0 4px; color: var(--primary-color); cursor: pointer; height: 32px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.alink:hover { color: #6fbf72; }
.alink.muted { color: var(--muted); }
.alink.muted:hover { color: var(--body-color); }

.searchbox { display: inline-flex; }
.searchbox input { height: 32px; width: 200px; border: 1px solid var(--ant-border); border-right: 0; border-radius: 4px 0 0 4px; padding: 0 11px; font: inherit; color: inherit; outline: none; }
.searchbox input:focus { border-color: var(--primary-color); }
.searchbox input::placeholder { color: var(--ant-placeholder); }
.searchbox button { width: 40px; height: 32px; border: 0; border-radius: 0 4px 4px 0; background: var(--primary-color); color: #fff; display: grid; place-items: center; cursor: pointer; }

.atag { height: 24px; line-height: 22px; padding: 0 7px; border: 1px solid var(--ant-border); background: var(--ant-head-bg); border-radius: 4px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; max-width: 100%; }
.atag .k { color: var(--muted); }
.atag .t { overflow: hidden; text-overflow: ellipsis; }
.atag:hover { border-color: var(--primary-color); }
.atag.seg { background: var(--ant-primary-1); border-color: #b7dfb9; }
.atag.sys { border-style: solid; }
.join { color: var(--muted); font-size: 13px; }

.radios { display: inline-flex; }
.radios button { height: 24px; padding: 0 10px; font-size: 13px; border: 1px solid var(--ant-border); background: #fff; cursor: pointer; }
.radios button + button { margin-left: -1px; }
.radios button:first-child { border-radius: 4px 0 0 4px; }
.radios button:last-child { border-radius: 0 4px 4px 0; }
.radios button.on { border-color: var(--primary-color); color: var(--primary-color); position: relative; z-index: 1; }
.matchlbl { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
/* the ⓘ beside Match: figure-manage's TooltipPopover (TooltipInfoIcon on a Radix hover card, side top):
   antd info-circle at 16px; a #111827 card, white at 90%, 384 wide, rounded 8, 12/16 padding, shadow-md, an arrow */
.infotip { display: inline-flex; color: rgba(0,0,0,.45); cursor: pointer; border-radius: 50%; }
.infotip:hover, .infotip:focus-visible { color: rgba(0,0,0,.85); }
.infotip:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 1px; }
.tipcard { position: fixed; z-index: 1000; width: min(384px, calc(100vw - 32px)); background: #111827; color: rgba(255,255,255,.9); border-radius: 8px; padding: 12px 16px; font-size: 14px; line-height: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1); pointer-events: none; }
.tipcard b { color: #fff; }
.tipcard .tiparrow { position: absolute; width: 10px; height: 5px; }
.tipcard .tiparrow svg { display: block; fill: #111827; }

/* dropdowns / popovers */
.pop { position: fixed; z-index: 110;   /* above the About panel and switcher (100), so an open list is never covered */ background: #fff; border-radius: 4px; box-shadow: var(--ant-shadow); padding: 4px 0; max-height: 420px; overflow: auto; min-width: 200px; }
.pop .og { padding: 8px 12px 4px; font-size: 12px; color: rgba(0,0,0,.45); }
.pop .og small { display: block; font-size: 12px; color: rgba(0,0,0,.35); }
.pop .opt { display: flex; align-items: flex-start; gap: 8px; padding: 5px 12px; cursor: pointer; line-height: 22px; }
.pop .opt:hover, .pop .opt.act { background: var(--ant-primary-1); }
.pop .none { padding: 5px 12px; line-height: 22px; color: var(--ant-disabled); cursor: not-allowed; }
.pop .opt.on { font-weight: 700; background: var(--ant-head-bg); }
.pop .opt .tx { flex: 1; min-width: 0; }
.pop .opt .d { display: block; font-weight: 400; font-size: 12px; line-height: 18px; color: var(--muted); }
.pop .opt .ck { color: var(--primary-color); margin-top: 3px; }
.pop .opt.disabled { color: var(--ant-disabled); cursor: not-allowed; }
.pop .opt.disabled:hover { background: none; }
.pop .sect { padding: 10px 12px 4px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--ant-split); }
.pop .sect:first-child { border-top: 0; }
.pop .sect small { font-weight: 400; color: var(--muted); }
.pop .divider { height: 1px; background: var(--ant-split); margin: 4px 0; }
.pop .head { padding: 8px 12px; border-bottom: 1px solid var(--ant-split); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.pop .head small { font-weight: 400; color: var(--muted); }
.cb { width: 16px; height: 16px; border: 1px solid var(--ant-border); border-radius: 2px; margin-top: 3px; display: grid; place-items: center; background: #fff; flex-shrink: 0; }
.cb.on { background: var(--primary-color); border-color: var(--primary-color); color: #fff; }
.rd { width: 16px; height: 16px; border: 1px solid var(--ant-border); border-radius: 50%; margin-top: 3px; flex-shrink: 0; display: grid; place-items: center; }
.rd.on { border-color: var(--primary-color); }
.rd.on::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary-color); }

/* table */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th { background: var(--ant-head-bg); text-align: left; font-weight: 400; padding: 16px; border-bottom: 1px solid var(--ant-split); white-space: nowrap; color: rgba(0,0,0,.85); }
th.num, td.num { text-align: right; }
td { padding: 12px 16px; border-bottom: 1px solid var(--ant-split); height: 56px; }
td .sub { display: block; font-size: 12px; line-height: 16px; color: var(--muted); }
tr:hover td { background: var(--ant-primary-1); }
.sorter { color: var(--ant-placeholder); font-size: 10px; margin-left: 4px; }
.pager { display: flex; justify-content: center; gap: 8px; padding: 16px 0 24px; }
.pager span { width: 32px; height: 32px; border: 1px solid var(--ant-border); border-radius: 4px; display: grid; place-items: center; color: var(--ant-disabled); }
.pager span.on { border-color: var(--primary-color); color: var(--primary-color); }
.empty { text-align: center; padding: 48px 0; color: var(--muted); }
.empty svg { color: #d9d9d9; margin-bottom: 8px; }
.empty div { margin-bottom: 4px; }

.hint { font-size: 12px; color: var(--muted); }

/* A and D with a segment picked: antd v3 disabled states (Select, Radio.Button, Button) */
.sel.dis, .sel.dis:hover { background: #f5f5f5; border-color: var(--ant-border); color: var(--ant-disabled); cursor: not-allowed; box-shadow: none; }
.sel.dis .val { color: var(--ant-disabled); }
.sel.dis .mtag { padding-right: 10px; color: rgba(0,0,0,.33); background: #f5f5f5; }
.sel.multi.dis .ph { padding-left: 7px; }
.sel.multi .tjoin { color: var(--ant-disabled); font-size: 13px; padding: 0 2px; }
.sel.multi:not(.dis) .tjoin { color: var(--muted); }
.atag.dis, .atag.dis:hover { background: #f5f5f5; border-color: var(--ant-border); color: var(--ant-disabled); cursor: not-allowed; }
.radios button:disabled { color: var(--ant-disabled); background: #f5f5f5; border-color: var(--ant-border); cursor: not-allowed; }
.radios button.on:disabled { color: #fff; background: #e6e6e6; }
.abtn:disabled, .abtn:disabled:hover { color: var(--ant-disabled); background: #f5f5f5; border-color: var(--ant-border); cursor: not-allowed; }

/* E: the segment as a locked base */
.atag.lock { background: #fff; cursor: default; color: rgba(0,0,0,.65); }
.atag.lock:hover { border-color: var(--ant-border); }
.atag.lock svg { color: var(--muted); }
.atag.bad { border-color: var(--error); color: var(--error); }
.atag.bad .k, .atag.bad i { color: var(--error); }
.segbox { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-height: 32px; max-width: 100%; border: 1px solid var(--ant-split); background: var(--ant-head-bg); border-radius: 4px; padding-right: 7px; }
.segbox > .sel { margin: -1px 2px -1px -1px; }
.segbox > .atag { margin: 3px 0; }
.segbox > .join { line-height: 24px; }
.segnote { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; line-height: 20px; color: var(--muted); }
.filters > .segnote { flex-basis: 100%; order: 9; }
.segnote svg { margin-top: 3px; }
.segnote b { color: var(--body-color); font-weight: 700; }
.pop .opt.disabled .d { color: var(--muted); }
.empty .why { max-width: 460px; margin: 0 auto 12px; color: var(--muted); }

/* ---------------- comparison switcher (not part of the design) ---------------- */
.switch { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 100; background: #1f2937; color: #e5e7eb; border-radius: 12px; padding: 6px; display: flex; gap: 6px; align-items: center; font-family: var(--v3-font); font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.switch button { background: none; border: 0; color: #d1d5db; padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.switch button.on { background: #fff; color: #111827; }
.switch .sep { width: 1px; height: 20px; background: #4b5563; }
.about { position: fixed; left: 50%; bottom: 68px; transform: translateX(-50%); z-index: 100; width: min(640px, calc(100vw - 32px)); background: #111827; color: #e5e7eb; border-radius: 12px; padding: 14px 16px; font-family: var(--v3-font); font-size: 13px; line-height: 1.55; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.about h3 { margin: 0 0 6px; font-size: 14px; color: #fff; }
.about p { margin: 0 0 6px; }
.about p:last-child { margin-bottom: 0; }
.about b { color: #fff; }
.about .cost { color: #fca5a5; }
.about { max-height: calc(100vh - 100px); overflow: auto; }
.phonestage { position: fixed; inset: 0; background: #e5e7eb; display: grid; place-items: center; z-index: 60; }
.phonestage iframe { width: 390px; height: 844px; border: 0; border-radius: 24px; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.2); max-height: calc(100vh - 100px); }

/* ---------------- phone ---------------- */
@media (max-width: 639px) {
    .app { display: block; height: auto; }
    .rail, .panel, .topbar { display: none; }
    .mobilebar { display: flex; height: 56px; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--v3-border); background: var(--v3-shell-bg); font-family: var(--v3-font); position: sticky; top: 0; z-index: 20; }
    .mobilebar .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--v3-primary); color: #fff; font-weight: 600; font-size: 13px; display: grid; place-items: center; }
    .mobilebar .grow { flex: 1; }
    .main { overflow: visible; }
    .page { padding: 16px; }
    .page h1 { font-size: 20px; line-height: 28px; margin-bottom: 12px; }
    .filters .sel, .filters .searchbox, .filters .full { width: 100% !important; }
    .filters .searchbox input { flex: 1; width: auto; min-width: 0; }
    .filters .push { margin-left: 0; }
    .filters .segbox { width: 100%; }
    .filters .segbox { padding: 0 7px 3px; }
    .filters .segbox > .sel { width: calc(100% + 16px) !important; margin: -1px -8px 0; }
    /* the summary line sits right under the segment it describes, not under Search */
    .filters > * { order: 2; }
    .filters > .sel:first-child { order: 0; }
    .filters > .segnote { order: 1; margin-top: -2px; }
    .v-A .filters { flex-direction: column; align-items: stretch; }
    .v-B .filters .searchbox { flex: 1; width: auto !important; min-width: 0; }
    .pop { max-width: calc(100vw - 32px); }
}

const activeCount = () => { const { base, conds } = current(); return (base ? 1 : 0) + conds.length; };

/* ---------- A and D: a picked segment ---------- */
// The one-way editable preset (D, 10-08) is gone: it can't load a segment with two tag conditions into one tag field.
// Match is disabled while a segment is picked; S.sm says what the fields do: lock (cleared, disabled), ro (the
// segment's rules shown read-only), narrow (live, narrowing the segment with AND).
const segMatch = s => s.conds.length > 1 ? s.match : 'all';
const locked = v => S[v].seg && S.sm !== 'narrow';
function clearOwn(v) { S[v].tags = []; if (v === 'A') S.A.filters = []; else S.D.chips = []; }
function pickSeg(v, id) { S[v].seg = id || null; if (locked(v)) clearOwn(v); }

/* ---------- E: the segment is a locked base ---------- */
// The segment's conditions are shown, never edited here (Roman, 10-08: editing segments on the list waits for a
// WebApp 3.0 Customers agenda). Tags and chips narrow it, always AND. Some filter pairs can never both be true:
// two Frequency or two Monetary buckets, Recency 180+ with any Last N Days, New Customers with Recency 180+.
const REC = { rec7: 7, rec28: 28, rec90: 90, rec180: 180 };
const fname = k => FILTERS[k].group ? `${FILTERS[k].group} ${FILTERS[k].label}` : FILTERS[k].label;
// b ANDed onto a: 'same', 'covered' (b is broader, so it changes nothing), 'never' (no customer has both), or null
function clash(a, b) {
  if (a === b) return 'same';
  const A = FILTERS[a], B = FILTERS[b];
  if (A.group && A.group === B.group) {
    if (REC[a] && REC[b]) return REC[b] >= REC[a] ? 'covered' : null;
    return 'never';
  }
  if ([a, b].sort().join() === 'new,rec180p') return 'never';
  return null;
}
// an any-of segment can't rule anything out: one of its other conditions can still match
const strict = s => s && (s.match === 'all' || s.conds.length === 1);
function whyNot(k, editing) {
  const c = S.E, s = c.seg ? segById(c.seg) : null;
  if (editing && editing.k === k) return null;
  if (strict(s)) for (const cd of s.conds) {
    if (cd.type !== 'filter') continue;
    const r = clash(cd.k, k);
    if (r === 'same' || r === 'covered') return `Already covered by ${s.name}`;
    if (r === 'never') return `Can’t combine with ${s.name} (${fname(cd.k)})`;
  }
  for (const ch of c.chips) {
    if (editing && ch.id === editing.id) continue;
    const r = clash(ch.k, k);
    if (r === 'same') return 'Already added';
    if (r === 'covered') return `Already covered by ${fname(ch.k)}`;
    if (r === 'never') return `Can’t combine with ${fname(ch.k)}`;
  }
  return null;
}
// chips that can never match the selected segment: possible when the segment is picked after the chips
function badChips() {
  const c = S.E, s = c.seg ? segById(c.seg) : null, bad = new Map();
  if (!strict(s)) return bad;
  c.chips.forEach(ch => s.conds.forEach(cd => { if (cd.type === 'filter' && clash(cd.k, ch.k) === 'never') bad.set(ch.id, cd.k); }));
  return bad;
}
const lockLabel = cd => cd.type === 'tag' ? `Tag: ${cd.tags.join(' or ')}` : FILTERS[cd.k].chip;

/* ---------- formatting ---------- */
const money = n => n ? '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '0';
const dateAgo = d => d == null ? '—' : new Date(TODAY - d * 864e5).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

/* ---------- controls per variant ---------- */
const searchBox = () => `<div class="searchbox push"><input id="q" placeholder="Search" value="${esc(S.search)}"><button>${ic('search', 14)}</button></div>`;
const arrow = `<span class="arrow">${ic('down', 12)}</span>`;

/* the multi-select fields, antd v3 Select mode="multiple": type to filter the list, picked items drop out of it,
   ✕ removes one, Backspace in an empty field removes the last.
   tags     shared by A, C and D: one condition, has any of these tags
   filters  A's predefined filters (10-08): each is its own condition, so the join word between them follows Match */
const MF = {
  // A's placeholders (Roman, 10-08): "Select segment | predefined filter | tag" ("to filter" dropped the same day)
  tags: { get: () => S[S.v].tags, set: x => { S[S.v].tags = x; }, all: () => TAGS, label: t => t, get ph() { return S.v === 'A' ? 'Select tag' : 'Filter by Tags'; }, w: 240 },
  filters: { get: () => S.A.filters, set: x => { S.A.filters = x; }, all: () => Object.keys(FILTERS), label: k => FILTERS[k].chip, ph: 'Select predefined filter', w: 260 },
};
const isMF = o => o === 'tags' || o === 'filters';
const mfMatches = f => { const q = S.tq.trim().toLowerCase(), m = MF[f], on = m.get(); return m.all().filter(x => !on.includes(x) && m.label(x).toLowerCase().includes(q)); };
function multiField(f, joiner) {
  const m = MF[f], vals = m.get(), j = joiner ? `<span class="tjoin">${joiner}</span>` : '';
  return `<div class="sel multi ${S.open === f ? 'open' : ''}" data-act="tf-open" data-f="${f}" data-pop="${f}" style="width:${m.w}px">` +
    vals.map(x => `<span class="mtag">${esc(m.label(x))}<i data-act="tf-rm" data-f="${f}" data-t="${esc(x)}">${ic('x', 10)}</i></span>`).join(j) +
    `<input class="tin" data-f="${f}" autocomplete="off" spellcheck="false" aria-label="${m.ph}"${vals.length ? '' : ` placeholder="${m.ph}"`} value="${S.open === f ? esc(S.tq) : ''}"></div>`;
}
const tagField = () => multiField('tags');

/* a picked segment's rules, read-only: its tag conditions in the one tag field (joined inside it), its filters as given */
const segTagGroups = s => s.conds.filter(c => c.type === 'tag').map(c => c.tags);
const segFilters = s => s.conds.filter(c => c.type === 'filter').map(c => c.k);
function fieldOff(f, groups, joiner, within) {   // within: the word inside one group (a segment's tag row is always "any of"); null = no word
  const w = x => x ? `<span class="tjoin">${x}</span>` : '';
  const inner = groups.map(g => g.map(t => `<span class="mtag">${esc(t)}</span>`).join(w(within))).join(w(joiner));
  return `<div class="sel multi dis" style="width:${MF[f].w}px" aria-disabled="true">${inner || `<span class="ph">${MF[f].ph}</span>`}</div>`;
}
const tagFieldOff = (groups, joiner) => fieldOff('tags', groups, joiner);
const matchRadios = (m, off, after = '') => `<span class="matchlbl">Match <span class="radios">${['all', 'any'].map(x => `<button class="${m === x ? 'on' : ''}" ${off ? 'disabled' : `data-act="match" data-m="${x}"`}>${x === 'all' ? 'All' : 'Any'}</button>`).join('')}</span>${after}</span>`;
/* A, Match shown: the ⓘ and its tooltip. Copy from the New Segment drawer's helper line under Match, minus its last
   sentence (Roman, 10-08): here each tag is its own condition, so "several tags match any of them" would be wrong */
const TIP = '<b>All:</b> every condition must be true. <b>Any:</b> at least one must be true.';
const infoTip = `<span class="infotip" tabindex="0" role="img" aria-label="About Match" aria-describedby="tipcard"><svg width="16" height="16" viewBox="64 64 896 896" fill="currentColor" aria-hidden="true"><path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"/><path d="M464 336a48 48 0 1 0 96 0 48 48 0 1 0-96 0zm72 112h-48c-4.4 0-8 3.6-8 8v272c0 4.4 3.6 8 8 8h48c4.4 0 8-3.6 8-8V456c0-4.4-3.6-8-8-8z"/></svg></span>`;
const segClear = `<span class="arrow" data-act="seg-clear">${ic('x', 12)}</span>`;

function filtersA() {
  const a = S.A, s = a.seg ? segById(a.seg) : null, off = locked('A');
  const segSel = `<div class="sel ${S.open === 'a-seg' ? 'open' : ''}" data-act="open" data-pop="a-seg" style="width:230px">${s ? `<span class="val">${esc(s.name)}</span>` : `<span class="ph">Select segment</span>`}${s ? segClear : arrow}</div>`;
  let fSel, tags;
  if (off) {   // read-only: every one of the segment's filters shows (Win-back's three)
    // Match shown: the segment's own words. Hidden: "or" is the field's rule, so only an "and" shows
    // (Wine Club Regulars: VIP Regular and Wine Club), or the segment would read as any of them
    const ro = S.sm === 'ro', sj = segMatch(s) === 'any' ? 'or' : 'and', shown = S.mt === 'on';
    const j = shown || sj === 'and' ? sj : null;
    fSel = fieldOff('filters', ro ? segFilters(s).map(k => [FILTERS[k].chip]) : [], j);
    tags = fieldOff('tags', ro ? segTagGroups(s) : [], j, shown ? 'or' : null);
  } else {   // Match shown: the and / or between items in both fields follows it. Hidden: no words
    const word = S.mt === 'off' ? null : a.match === 'any' ? 'or' : 'and';
    fSel = multiField('filters', word);
    tags = multiField('tags', word);
  }
  const match = S.mt === 'off' ? '' : s ? matchRadios(S.sm === 'narrow' ? 'all' : segMatch(s), true, infoTip) : matchRadios(a.match, nConds(a) < 2, infoTip);
  return `<div class="filters">
    ${segSel}
    ${fSel}
    ${tags}
    ${match}
    ${searchBox()}
  </div>`;
}

function filtersB() {
  const b = S.B, n = activeCount();
  const chips = [];
  if (b.seg) chips.push(`<span class="atag seg" data-act="open" data-pop="b-pick"><span class="k">Segment:</span><span class="t">${esc(segById(b.seg).name)}</span><i data-act="b-unseg">${ic('x', 10)}</i></span>`);
  if (b.tags.length) chips.push(`<span class="atag" data-act="open" data-pop="b-pick"><span class="k">Tag:</span><span class="t">${esc(b.tags.join(' or '))}</span><i data-act="b-untags">${ic('x', 10)}</i></span>`);
  b.filters.forEach(k => chips.push(`<span class="atag sys" data-act="open" data-pop="b-pick"><span class="t">${esc(FILTERS[k].chip)}</span><i data-act="b-unfilter" data-k="${k}">${ic('x', 10)}</i></span>`));
  return `<div class="filters">
    <button class="abtn ${n ? 'on' : ''} ${S.open === 'b-pick' ? 'open' : ''}" data-act="open" data-pop="b-pick">${ic('funnel', 14)}Filter${n ? `<span class="badge">${n}</span>` : ''}</button>
    ${searchBox()}
  </div>
  ${chips.length ? `<div class="chiprow">${chips.join('')}<button class="alink muted" data-act="clear">Clear all</button></div>` : ''}`;
}

/* C, C2, D: the tag field, then the filter chips, with the join word between every condition */
function conditions(c, joiner, bad) {
  const j = `<span class="join">${joiner}</span>`;
  const chips = c.chips.map(ch => `<span class="atag sys${bad && bad.has(ch.id) ? ' bad' : ''}" data-act="edit-chip" data-id="${ch.id}"><span class="t">${esc(FILTERS[ch.k].chip)}</span><i data-act="rm-chip" data-id="${ch.id}">${ic('x', 10)}</i></span>`);
  return tagField(c.tags) + (c.tags.length && chips.length ? j : '') + chips.join(j);
}
const matchCtl = c => nConds(c) >= 2
  ? `<span class="matchlbl">Match <span class="radios"><button class="${c.match === 'all' ? 'on' : ''}" data-act="match" data-m="all">All</button><button class="${c.match === 'any' ? 'on' : ''}" data-act="match" data-m="any">Any</button></span></span>` : '';
const addFilter = off => off ? `<button class="abtn dashed" disabled>${ic('plus', 14)}Filter</button>` : `<button class="abtn dashed ${S.open === 'c-filter' && !S.editChip ? 'open' : ''}" data-act="open" data-pop="c-filter">${ic('plus', 14)}Filter</button>`;
const clearLink = c => nConds(c) ? `<button class="alink muted" data-act="clear">Clear</button>` : '';

function filtersC() {
  const v = S.v, c = S[v], s = c.seg ? segById(c.seg) : null;
  return `<div class="filters">
    <div class="sel full ${S.open === 'c-seg' ? 'open' : ''}" data-act="open" data-pop="c-seg" style="width:240px">${ic('funnel', 14)}<span class="val" style="margin-left:8px">${s ? esc(s.name) : 'All customers'}</span>${arrow}</div>
    ${v === 'C2' ? matchCtl(c) : ''}
    ${conditions(c, v === 'C2' && c.match === 'any' ? 'or' : 'and')}
    ${addFilter()}
    ${clearLink(c)}
    ${searchBox()}
  </div>`;
}

function filtersD() {
  const d = S.D, s = d.seg ? segById(d.seg) : null, off = locked('D');
  const label = s ? `<span class="val" style="margin-left:8px">${esc(s.name)}</span>` : `<span class="ph" style="margin-left:8px">Select segment</span>`;
  // A's order (Roman, 10-08): the filter chips and + Filter, then the tag field, then Match
  let conds;
  if (off && S.sm === 'ro') {
    const sj = segMatch(s) === 'any' ? 'or' : 'and', j = `<span class="join">${sj}</span>`, groups = segTagGroups(s);
    const chips = segFilters(s).map(k => `<span class="atag sys dis" aria-disabled="true"><span class="t">${esc(FILTERS[k].chip)}</span></span>`);
    conds = chips.join(j) + addFilter(true) + (groups.length && chips.length ? j : '') + tagFieldOff(groups, sj);
  } else if (off) conds = addFilter(true) + tagFieldOff([], 'and');
  else {
    const j = `<span class="join">${s || d.match !== 'any' ? 'and' : 'or'}</span>`;
    const chips = d.chips.map(ch => `<span class="atag sys" data-act="edit-chip" data-id="${ch.id}"><span class="t">${esc(FILTERS[ch.k].chip)}</span><i data-act="rm-chip" data-id="${ch.id}">${ic('x', 10)}</i></span>`);
    conds = chips.join(j) + addFilter() + (chips.length && d.tags.length ? j : '') + tagField();
  }
  const match = s ? matchRadios(S.sm === 'narrow' ? 'all' : segMatch(s), true) : nConds(d) >= 2 ? matchRadios(d.match, false) : '';
  return `<div class="filters">
    <div class="sel full ${S.open === 'd-seg' ? 'open' : ''}" data-act="open" data-pop="d-seg" style="width:240px">${ic('funnel', 14)}${label}${s ? segClear : arrow}</div>
    ${conds}
    ${match}
    ${off ? '' : clearLink(d)}
    ${searchBox()}
  </div>`;
}

function filtersE() {
  const c = S.E, s = c.seg ? segById(c.seg) : null, chipsLook = S.v === 'E2';
  const sel = `<div class="sel full ${S.open === 'c-seg' ? 'open' : ''}" data-act="open" data-pop="c-seg" style="width:240px">${ic('funnel', 14)}<span class="val" style="margin-left:8px">${s ? esc(s.name) : 'All customers'}</span>${arrow}</div>`;
  const tip = 'Set by the segment. Change it in Customer Segments.';
  const locked = s && chipsLook
    ? `<div class="segbox">${sel}${s.conds.map(cd => `<span class="atag lock" title="${tip}">${ic('lock', 11)}<span class="t">${esc(lockLabel(cd))}</span></span>`).join(`<span class="join">${s.match === 'any' ? 'or' : 'and'}</span>`)}</div>${nConds(c) ? '<span class="join">and</span>' : ''}`
    : sel;
  const note = s && !chipsLook
    ? `<div class="segnote" title="${tip}">${ic('lock', 13)}<span><b>${esc(s.name)}</b> is customers with ${s.conds.length > 1 ? (s.match === 'any' ? 'any of: ' : 'all of: ') : ''}${s.conds.map(cd => esc(lockLabel(cd))).join(', ')}. Your tags and filters narrow it.</span></div>`
    : '';
  return `<div class="filters">
    ${locked}
    ${conditions(c, 'and', badChips())}
    ${addFilter()}
    ${clearLink(c)}
    ${searchBox()}
    ${note}
  </div>`;
}

/* ---------- popovers ---------- */
function filterOptions(isOn, act, extra = '', why = null) {
  return FGROUPS.map(g => `${g.name ? `<div class="og">${g.name}<small>${g.desc}</small></div>` : ''}` +
    g.items.map(([k]) => {
      const f = FILTERS[k], on = isOn(k), r = why && why(k);
      if (r) return `<div class="opt disabled" aria-disabled="true"><span class="tx">${f.label}<span class="d">${esc(r)}</span></span></div>`;
      return `<div class="opt ${on ? 'on' : ''}" data-act="${act}" data-k="${k}" ${extra}>${S.open === 'b-pick' ? `<span class="cb ${on ? 'on' : ''}">${on ? ic('check', 10, 3) : ''}</span>` : ''}<span class="tx">${f.label}<span class="d">${f.desc}</span></span>${on && S.open !== 'b-pick' ? `<span class="ck">${ic('check', 14)}</span>` : ''}</div>`;
    }).join('')).join('');
}
function segOptions(isOn, act, withAll, radio) {
  const all = withAll ? `<div class="opt ${isOn(null) ? 'on' : ''}" data-act="${act}" data-id=""><span class="tx">All customers<span class="d">${CUSTOMERS.length} customers, no segment</span></span>${isOn(null) ? `<span class="ck">${ic('check', 14)}</span>` : ''}</div><div class="divider"></div>` : '';
  return all + SEGMENTS.map(s => `<div class="opt ${isOn(s.id) ? 'on' : ''}" data-act="${act}" data-id="${s.id}">${radio ? `<span class="rd ${isOn(s.id) ? 'on' : ''}"></span>` : ''}<span class="tx">${esc(s.name)}<span class="d">${esc(segSummary(s))}</span></span>${isOn(s.id) && !radio ? `<span class="ck">${ic('check', 14)}</span>` : ''}</div>`).join('');
}
function popover() {
  const o = S.open; if (!o) return '';
  let html = '', w = 0;
  if (o === 'tags') {   // antd's notFoundContent covers both an empty list and no match: SelectAutocomplete sets one text for both
    w = 240; const list = mfMatches('tags');
    html = list.length ? list.map((t, i) => `<div class="opt ${i === S.hi ? 'act' : ''}" data-act="tf-add" data-f="tags" data-t="${esc(t)}"><span class="tx">${esc(t)}</span></div>`).join('') : `<div class="none">All items selected</div>`;
  }
  if (o === 'filters') {   // A: no group headings (Roman, 10-08); groups split by a line, as figure-manage's Menu.Divider
    // (Sales by Items view filter). Picked filters drop out, and a group left empty takes its line with it
    w = 280; const list = mfMatches('filters');
    html = list.length ? FGROUPS.map(g => g.items.map(i => i[0]).filter(k => list.includes(k))).filter(ks => ks.length).map(ks =>
      ks.map(k => `<div class="opt ${list.indexOf(k) === S.hi ? 'act' : ''}" data-act="tf-add" data-f="filters" data-t="${k}"><span class="tx">${FILTERS[k].label}${S.names === 'new' ? '' : `<span class="d">${FILTERS[k].desc}</span>`}</span></div>`).join('')).join('<div class="divider"></div>') : `<div class="none">All items selected</div>`;
  }
  if (o === 'a-seg') { w = 280; html = segOptions(id => S.A.seg === id, 'seg-pick', false); }
  if (o === 'b-pick') {
    w = 340;
    html = `<div class="sect">Segments <small>pick one</small></div>` +
      `<div class="opt ${!S.B.seg ? 'on' : ''}" data-act="b-seg" data-id=""><span class="rd ${!S.B.seg ? 'on' : ''}"></span><span class="tx">None</span></div>` +
      segOptions(id => S.B.seg === id, 'b-seg', false, true) +
      `<div class="sect">${ic('tag', 13)}Tags <small>added by you</small></div>` +
      TAGS.map(t => { const on = S.B.tags.includes(t); return `<div class="opt ${on ? 'on' : ''}" data-act="b-tag" data-t="${esc(t)}"><span class="cb ${on ? 'on' : ''}">${on ? ic('check', 10, 3) : ''}</span><span class="tx">${esc(t)}</span></div>`; }).join('') +
      `<div class="sect">${ic('sparkles', 13)}Predefined filters <small>worked out by Figure</small></div>` +
      filterOptions(k => S.B.filters.includes(k), 'b-filter');
  }
  if (o === 'c-seg') { w = 300; const c = S[S.v]; html = segOptions(id => c.seg === id, 'c-seg', true); }
  if (o === 'd-seg') {
    w = 300;
    html = SEGMENTS.map(sg => { const on = S.D.seg === sg.id;
      return `<div class="opt ${on ? 'on' : ''}" data-act="seg-pick" data-id="${sg.id}"><span class="tx">${esc(sg.name)}<span class="d">${esc(segSummary(sg))}</span></span>${on ? `<span class="ck">${ic('check', 14)}</span>` : ''}</div>`;
    }).join('');
  }
  if (o === 'c-filter') { w = 300; const ch = S.editChip ? S[S.v].chips.find(x => x.id === S.editChip) : null; html = filterOptions(k => ch && ch.k === k, 'c-filter', '', S.v === 'E' || S.v === 'E2' ? k => whyNot(k, ch) : null); }
  return `<div class="pop" id="pop" style="width:${w}px">${html}</div>`;
}

/* ---------- line above the table ---------- */
// No result counter ("Showing 6 of 32 customers"): Roman, 10-08, noise, and no other WebApp agenda has one.
// What's left is the segment's summary in the eliminated options that need it (A / D lock and narrow, C, C2).
function countLine() {
  const { base } = current();
  let extra = '';
  if ((S.v === 'A' || S.v === 'D') && base && S.sm !== 'ro') extra = `<span class="hint">${esc(base.name)}: ${esc(segSummary(base))}</span>`;
  if ((S.v === 'C' || S.v === 'C2') && base) extra = `<span class="hint">${esc(base.name)}: ${esc(segSummary(base))}</span>`;

}
/* ---------- table ---------- */
function table(rows) {
  const bad = S.v === 'E' || S.v === 'E2' ? badChips() : new Map();
  if (!rows.length && bad.size) {
    const s = segById(S.E.seg), [id, k] = [...bad][0], ch = S.E.chips.find(x => x.id === id);
    const why = bad.size === 1
      ? `${esc(s.name)} is ${esc(fname(k))}, so ${esc(fname(ch.k))} can’t match anyone in it.`
      : `${esc(s.name)} rules out the filters marked in red.`;
    return `<div class="empty">${ic('inbox', 48, 1.25)}<div>No customers can match these filters</div><div class="why">${why}</div><button class="alink" data-act="rm-bad">${bad.size === 1 ? `Remove ${esc(fname(ch.k))}` : 'Remove the red filters'}</button></div>`;
  }
  if (!rows.length) return `<div class="empty">${ic('inbox', 48, 1.25)}<div>No customers match these filters</div><button class="alink" data-act="clear">Clear filters</button></div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Contact Information<span class="sorter">⇅</span></th><th class="num">Total Spend<span class="sorter" style="color:var(--primary-color)">▼</span></th><th class="num"># Visit(s)<span class="sorter">⇅</span></th><th class="num">Average Spend<span class="sorter">⇅</span></th><th class="num">Last Visit<span class="sorter">⇅</span></th></tr></thead><tbody>` +
    rows.map(c => `<tr><td>${esc(c.name)}${c.sub ? `<span class="sub">${esc(c.sub)}</span>` : ''}</td><td>${esc(c.phone)}${c.email ? `<span class="sub">${esc(c.email)}</span>` : ''}</td><td class="num">${money(c.total)}</td><td class="num">${c.visits}</td><td class="num">${c.visits ? money(c.total / c.visits) : '0'}</td><td class="num">${dateAgo(c.last)}</td></tr>`).join('') +
    `</tbody></table></div><div class="pager"><span>‹</span><span class="on">1</span><span>›</span></div>`;
}

/* ---------- about + switcher ---------- */
const ABOUT = {
  E: ['E · Locked segment, summary line', 'Pick a segment, or All customers. The line under the filters says what the segment includes, read-only: segments are edited in Customer Segments, never here. Tags and Filter chips only narrow it, always AND. Filters that can’t change the result are grayed in the + Filter list with the reason (open it on High Spenders: Monetary is out, so is Recency 180+ next to Last 28 Days). Add Monetary: $25–100 under All customers, then pick High Spenders: the chip turns red and the empty state says why.', 'Two layers to tell apart: the segment’s (locked) and yours. A segment can only be narrowed here, never loosened.'],
  E2: ['E · Locked segment, chips in the row', 'As E, but the segment’s conditions sit beside it as locked chips (a lock, no ✕), boxed with the selector and joined by the segment’s own and / or. Your tags and chips follow after “and”.', 'A longer row: Win-back adds three chips, Staff and Partners one very long one, and the box wraps. The locked chips are close to your removable ones; only the lock, the missing ✕ and the box tell them apart.'],
  A: ['A · Three dropdowns', 'Segment, predefined filters, tags, and Match All / Any when it’s shown. Both filter fields are multi-selects you type into.', 'Segments overlap the other two fields, and the row stacks into five rows on a phone. Filters that can’t both be true (two Recency buckets with All) aren’t stopped.'],
  B: ['B · One Filter button', 'One grouped picker: Segments, then Tags (added by you), then Predefined filters (worked out by Figure). Picks show as chips under the button, and every chip has to match. Tags in one chip match any of them.', 'Segments still sit beside the conditions they’re made of, so picking “High Spenders” and Monetary $1,000+ shows the same rule twice. A long picker (32 options) to scroll.'],
  C: ['C · Segment is the view', 'Pick a segment, or All customers, then narrow it: type tags into the tag field (any of them matches) and add Filter chips. The tags and every chip have to match: the segment builder’s rules, so nothing new to define.', 'A busier filter row than B.'],
  D: ['D · Segment + chips', 'Segment, + Filter chips, the tag field, then Match All / Any: A’s order. With no segment you build your own and Match joins them; it shows once there are two. The old one-way preset is gone: it couldn’t load a segment with two tag conditions, such as Wine Club Regulars.', 'A long row: at 1440 Search wraps to a second line once Match shows, and Match appearing at the end of the row moves Search.'],
  C2: ['C + any/all · Match toggle among the conditions', 'As C, plus Match All / Any once there are two conditions (the tag field counts as one). It applies among them only, and the segment still narrows them. ', '“Any” widens the list (VIP or Lapsed 180+ shows both crowds), the join word changes from “and” to “or”, and an any-of segment with any-of chips on top is a group inside a group, which segments don’t allow.'],
};
// A's tweaks: the About panel shows only what the active states change (Roman, 10-08), never what all of them share.
// [state key, value, name, what it does, cost]
const TW = [
  ['mt', 'off', 'Match hidden', 'No Match and no and / or. A customer needs any of the items in a field, and all of the fields.', 'No way to ask for every one of several tags or filters.'],
  ['mt', 'on', 'Match shown', 'Match All / Any with an ⓘ. Each filter and each tag is its own condition, and the and / or between them follows Match.', 'One more control to understand. At 1440 Search wraps to a second line.'],
  ['names', 'prd', 'PRD names', 'Each filter has a description line, and chips carry their group (Recency: Last 28 Days).', 'Two “180+ Days”, told apart only by their descriptions.'],
  ['names', 'new', 'Proposed names', 'Each name explains itself (Bought in last 28 days): no description lines, no group on the chips.', 'Draft copy, open with the PM.'],
];
// A and D: what a picked segment does to the fields, added to the About text
const SM = {
  lock: ['Clear and lock', 'With a segment picked, the filter and tag fields are emptied and disabled, and so is Match: the segment alone filters the list, its rules only in the line under the filters. ✕ on the segment gives the fields back, empty.', 'A segment can’t be narrowed, and its rules aren’t on screen. Picking one throws away the filters and tags already set.'],
  ro: ['Read-only', 'With a segment picked, its rules show in the fields, disabled, and Match shows its All / Any, disabled. Try Wine Club Regulars or Brunch and Staff Regulars: two tag conditions in the one tag field, joined by “and” inside it, and Win-back: all three filters, any of them. ✕ on the segment gives the fields back, empty.', 'antd’s disabled gray is faint, so the rules are hard to read, and the selected Match value, where Match shows, is white on light gray, close to invisible. A segment can’t be narrowed.'],
  narrow: ['Narrows', 'With a segment picked, the fields stay live and narrow it, always AND, so Match is disabled at All. Its rules are in the line under the filters.', 'Match only works with no segment: tags and filters set to Any turn into All the moment a segment is picked, and the list changes with no warning.'],
};
function switcher() {
  let a = ABOUT[S.v];
  if (S.v === 'A' || S.v === 'D') { const m = SM[S.sm]; a = [a[0], `${a[1]} <b>${m[0]}:</b> ${m[1]}`, `${a[2]} ${m[2]}${S.v === 'A' && m[3] ? ' ' + m[3] : ''}`]; }
  const about = S.v === 'A'
    ? TW.filter(([key, val]) => S[key] === val).map(([, , name, what, cost]) => `<p><b>${name}:</b> ${what}<br><span class="cost">Cost: ${cost}</span></p>`).join('')
    : `<h3>${a[0]}</h3><p>${a[1]}</p><p class="cost"><b>Cost:</b> ${a[2]}</p>`;
  const b = (k, l) => `<button class="${S.v === k ? 'on' : ''}" data-act="v" data-v="${k}">${l}</button>`;
  // A is the only option left (Roman, 10-08): no variant button for it, its tweaks instead. A deep-linked option gets a way back
  const tw = (label, key, opts) => `<span class="sep"></span><span style="color:#9ca3af;padding:0 2px 0 4px;white-space:nowrap">${label}</span>` + opts.map(([v, l]) => `<button class="${S[key] === v ? 'on' : ''}" data-act="tw" data-k="${key}" data-val="${v}">${l}</button>`).join('');
  const variants = S.v === 'A'
    ? (tw('Match', 'mt', [['off', 'Hidden'], ['on', 'Shown']]) + tw('Filter names', 'names', [['prd', 'PRD'], ['new', 'Proposed']])).replace('<span class="sep"></span>', '')
    : b('A', 'A · Dropdowns') + b(S.v, { B: 'B · Filter button', C: 'C · Segment view', C2: 'C + any/all', D: 'D · Segment + chips', E: 'E · Locked, line', E2: 'E · Locked, chips' }[S.v]);
  return `${S.about ? `<div class="about">${about}</div>` : ''}
  <div class="switch">${variants}
    <span class="sep"></span><button class="${!S.phone ? 'on' : ''}" data-act="phone" data-p="0">Desktop</button><button class="${S.phone ? 'on' : ''}" data-act="phone" data-p="1">Phone 390</button>
    <span class="sep"></span><button class="${S.about ? 'on' : ''}" data-act="about">About</button></div>`;
}

/* ---------- render ---------- */
function render() {
  const root = document.getElementById('root');
  if (S.phone && !S.embed) {
    root.innerHTML = `<div class="phonestage"><iframe src="?${urlParams(true)}" title="Phone 390"></iframe></div>` + switcher();
    return;
  }
  const scroll = document.getElementById('main')?.scrollTop || 0;
  const rows = results();
  const f = S.v === 'A' ? filtersA() : S.v === 'B' ? filtersB() : S.v === 'D' ? filtersD() : S.v === 'E' || S.v === 'E2' ? filtersE() : filtersC();
  const tip = S.v === 'A' && S.mt === 'on' ? `<div class="tipcard" id="tipcard" role="tooltip" hidden>${TIP}<span class="tiparrow"><svg width="10" height="5" viewBox="0 0 30 10" preserveAspectRatio="none"><polygon points="0,0 30,0 15,10"/></svg></span></div>` : '';
  root.innerHTML = shell(`<div class="page"><div class="card"><h1>Customers</h1>${f}<div id="countwrap">${countLine()}</div><div id="tablewrap">${table(rows)}</div></div></div>`) + popover() + switcher() + tip;
  const m = document.getElementById('main'); if (m) m.scrollTop = scroll;
  placePopover();
  document.querySelectorAll('.tin').forEach(tin => {
    const f = tin.dataset.f;
    if (S.open === f) { tin.focus({ preventScroll: true }); tin.setSelectionRange(tin.value.length, tin.value.length); }
    tin.addEventListener('input', e => { S.tq = e.target.value; S.hi = 0; if (S.open !== f) { closePop(); S.open = f; S.tq = e.target.value; render(); } else refreshPop(); });
    tin.addEventListener('keydown', mfKeys);
  });
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', e => { S.search = e.target.value; const r = results(); document.getElementById('countwrap').innerHTML = countLine(r.length); document.getElementById('tablewrap').innerHTML = table(r); });
}
function placePopover() {
  const pop = document.getElementById('pop'); if (!pop) return;
  const anchor = S.editChip ? document.querySelector(`[data-act="edit-chip"][data-id="${S.editChip}"]`) : document.querySelector(`[data-pop="${S.open}"]`);
  if (!anchor) return;
  const r = anchor.getBoundingClientRect(), vw = window.innerWidth;
  if (isMF(S.open)) pop.style.width = Math.max(r.width, S.open === 'filters' ? 280 : 0) + 'px';   // antd: the list matches the field's width (the filter list needs room for its descriptions)
  let left = Math.min(r.left, vw - pop.offsetWidth - 16); left = Math.max(16, left);
  pop.style.left = left + 'px'; pop.style.top = (r.bottom + 4) + 'px';
  pop.style.maxHeight = Math.max(200, window.innerHeight - r.bottom - 24) + 'px';
  if (vw < 640) pop.style.width = Math.min(pop.offsetWidth, vw - 32) + 'px';
}

/* ---------- events ---------- */
const toggle = (arr, x) => arr.includes(x) ? arr.filter(y => y !== x) : [...arr, x];
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.open && !e.target.closest('#pop')) { closePop(); render(); } return; }
  const act = el.dataset.act, d = el.dataset;
  e.stopPropagation();
  const c = S[S.v];
  switch (act) {
    // the multi-select fields: tags (A, C, D) and A's filters
    case 'tf-open': if (S.open !== d.f) { closePop(); S.open = d.f; } break;
    case 'tf-add': MF[d.f].set([...MF[d.f].get(), d.t]); S.tq = ''; S.hi = 0; break;
    case 'tf-rm': MF[d.f].set(MF[d.f].get().filter(x => x !== d.t)); break;
    case 'v': S.v = d.v; closePop(); syncUrl(); break;
    case 'phone': S.phone = d.p === '1'; syncUrl(); break;
    case 'about': S.about = !S.about; break;
    case 'tw': S[d.k] = d.val; if (d.k === 'names') applyNames(); syncUrl(); break;
    case 'open': { const was = S.open === d.pop && !S.editChip; closePop(); if (!was) S.open = d.pop; break; }
    // A and D: the segment
    case 'seg-pick': pickSeg(S.v, d.id); closePop(); break;
    case 'seg-clear': S[S.v].seg = null; closePop(); break;
    case 'sm': S.sm = d.m; ['A', 'D'].forEach(v => { if (locked(v)) clearOwn(v); }); syncUrl(); break;
    // B
    case 'b-tag': S.B.tags = toggle(S.B.tags, d.t); break;
    case 'b-filter': S.B.filters = toggle(S.B.filters, d.k); break;
    case 'b-seg': S.B.seg = d.id || null; break;
    case 'b-unseg': S.B.seg = null; closePop(); break;
    case 'b-untags': S.B.tags = []; closePop(); break;
    case 'b-unfilter': S.B.filters = S.B.filters.filter(k => k !== d.k); closePop(); break;
    // C, C2
    case 'c-seg': c.seg = d.id || null; closePop(); break;
    case 'c-filter': {
      if (S.editChip) { c.chips.find(x => x.id === S.editChip).k = d.k; }
      else c.chips.push({ id: 'k' + chipSeq++, type: 'filter', k: d.k });
      closePop(); break;
    }
    case 'edit-chip': { const was = S.editChip === d.id; closePop(); if (!was) { S.editChip = d.id; S.open = 'c-filter'; } break; }
    case 'rm-chip': c.chips = c.chips.filter(x => x.id !== d.id); closePop(); break;
    case 'rm-bad': { const bad = badChips(); S.E.chips = S.E.chips.filter(x => !bad.has(x.id)); closePop(); break; }
    case 'match': c.match = d.m; break;
    case 'clear':
      if (S.v === 'A') S.A = { seg: null, filters: [], tags: [], match: 'all' };
      else if (S.v === 'B') S.B = { tags: [], filters: [], seg: null };
      else { c.tags = []; c.chips = []; c.match = 'all'; if (!e.target.closest('.filters')) c.seg = null; }
      S.search = ''; closePop(); break;
  }
  settle();
  render();
});
/* after any change: Match falls back to All under two conditions */
function settle() { ['A', 'C2', 'D'].forEach(v => { if (nConds(S[v]) < 2) S[v].match = 'all'; }); }
/* the multi-select fields' keys, as antd v3 multiple: arrows move the highlight, Enter picks it, Backspace in an empty field removes the last item */
function mfKeys(e) {
  const f = e.target.dataset.f, m = MF[f], list = mfMatches(f);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (S.open !== f) { closePop(); S.open = f; render(); return; }
    if (list.length) S.hi = (S.hi + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length;
    refreshPop();
  } else if (e.key === 'Enter') {
    e.preventDefault(); if (S.open !== f) { closePop(); S.open = f; render(); return; }
    if (!list[S.hi]) return;
    m.set([...m.get(), list[S.hi]]); S.tq = ''; S.hi = 0; settle(); render();
  } else if (e.key === 'Backspace' && !e.target.value && m.get().length) {
    m.set(m.get().slice(0, -1)); S.hi = 0; settle(); render();
  }
}
function refreshPop() { const p = document.getElementById('pop'); if (p) { p.outerHTML = popover(); placePopover(); } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePop(); render(); } });
function closePop() { S.open = null; S.editChip = null; S.tq = ''; S.hi = 0; }
function urlParams(embed) {
  const p = new URLSearchParams(); p.set('v', S.v); if ((S.v === 'A' || S.v === 'D') && S.sm !== 'ro') p.set('sm', S.sm);
  if (S.v === 'A') { if (S.mt === 'on') p.set('match', 'on'); if (S.names === 'new') p.set('names', 'new'); }
  if (embed) p.set('embed', '1'); else if (S.phone) p.set('phone', '1');
  return p;
}
function syncUrl() { history.replaceState(null, '', '?' + urlParams(false)); }
/* the ⓘ tooltip: opens on hover and on keyboard focus, as the Radix hover card does; above the icon (side top, centered),
   kept 16px inside the viewport, below the icon when there's no room above */
function showTip(t) {
  const tip = document.getElementById('tipcard'); if (!tip) return;
  tip.hidden = false;
  const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, vw = window.innerWidth, cx = r.left + r.width / 2;
  const left = Math.max(16, Math.min(cx - w / 2, vw - w - 16)), up = r.top - h - 8 >= 8;
  tip.style.left = left + 'px'; tip.style.top = (up ? r.top - h - 8 : r.bottom + 8) + 'px';
  const a = tip.querySelector('.tiparrow'); a.style.left = (cx - left - 5) + 'px';
  a.style.top = up ? '100%' : '-5px'; a.style.transform = up ? '' : 'rotate(180deg)';
}
const hideTip = () => { const tip = document.getElementById('tipcard'); if (tip) tip.hidden = true; };
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('.infotip'); if (t) showTip(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest && e.target.closest('.infotip'); if (t && !t.contains(e.relatedTarget) && document.activeElement !== t) hideTip(); });
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('infotip')) showTip(e.target); });
document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('infotip')) hideTip(); });
window.addEventListener('resize', placePopover);
document.addEventListener('scroll', e => { if (S.open && !(e.target.closest && e.target.closest('#pop'))) { closePop(); render(); } }, true);

render();
</script>
